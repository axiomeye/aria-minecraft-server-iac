name: report boot failure
run-name: report boot failure [${{ github.event.client_payload.world || 'classic' }}]

on:
  repository_dispatch:
    types: [boot-failed]

concurrency:
  group: report-boot-failure-${{ github.event.client_payload.world || 'classic' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    name: "Notify"
    runs-on: ubuntu-24.04
    environment: aria-production

    steps:
      - name: Send telegram message
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ⚠️ ${{ github.event.client_payload.world }} failed to start

            ${{ github.event.client_payload.reason }}
