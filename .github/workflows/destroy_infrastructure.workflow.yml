name: destroy infrastructure

on:
  repository_dispatch:
    types: [destroy-infr]
  workflow_dispatch:
    inputs:
      world:
        description: "Which world to destroy"
        type: choice
        default: classic
        options: [classic, cobblemon, latest]

concurrency:
  group: destroy-infr-${{ github.event.client_payload.world || inputs.world || 'classic' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-24.04
    environment: aria-production

    env:
      WORLD: ${{ github.event.client_payload.world || inputs.world || 'classic' }}
      TF_VAR_world: ${{ github.event.client_payload.world || inputs.world || 'classic' }}
      # Terraform variables (from environment)
      TF_VAR_region: ${{ vars.REGION }}
      TF_VAR_project_id: reflected-gamma-341201
      TF_VAR_zone: ${{ vars.ZONE }}
      TF_VAR_service_account: ${{ vars.GCP_VM_SERVICE_ACCOUNT }}
      TF_VAR_boot_image: ${{ vars.BOOT_IMAGE }}
      TF_VAR_boot_disk_size_gb: ${{ vars.BOOT_DISK_SIZE_GB }}
      TF_VAR_network_name: ${{ vars.NETWORK_NAME }}
      TF_VAR_subnet_name: ${{ vars.SUBNET_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Send telegram message (starting)
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🌍 World: ${{ env.WORLD }}
            ${{ vars.BEGIN_DESTROY_MESSAGE }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "latest"

      - name: Terraform Init
        working-directory: ./terraform/vm
        run: |
          terraform init -upgrade \
            -backend-config="bucket=${{ secrets.GCP_BUCKET }}" \
            -backend-config="prefix=terraform-states/vm/$WORLD"

      - name: Terraform Destroy
        working-directory: ./terraform/vm
        run: terraform apply -destroy -auto-approve -target=google_compute_instance.aria_server

      - name: Send telegram message (completed)
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🌍 World: ${{ env.WORLD }}
            ${{ vars.DESTROY_MESSAGE }}
